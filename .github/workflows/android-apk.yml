name: Build NeoCooler Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Build web app
        run: npm install --no-audit --no-fund && npm run build

      - name: Install Bubblewrap 1.25
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Prepare Bubblewrap-compatible Android SDK
        run: |
          set -e
          BW_SDK="$HOME/.bubblewrap/android_sdk"
          rm -rf "$BW_SDK"
          mkdir -p "$BW_SDK"

          # Bubblewrap expects its SDK root to contain bin/ (or tools/).
          # GitHub's Android SDK keeps sdkmanager under cmdline-tools/latest/bin.
          cp -a "$ANDROID_SDK_ROOT/cmdline-tools/latest/." "$BW_SDK/"

          ln -sfn "$ANDROID_SDK_ROOT/platform-tools" "$BW_SDK/platform-tools"
          ln -sfn "$ANDROID_SDK_ROOT/platforms" "$BW_SDK/platforms"

          # Build Tools 34 is the version used by Bubblewrap 1.25.
          yes | "$BW_SDK/bin/sdkmanager" --sdk_root="$BW_SDK" --licenses || true
          "$BW_SDK/bin/sdkmanager" --sdk_root="$BW_SDK" "build-tools;34.0.0"

          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME_17_X64",
            "androidSdkPath": "$BW_SDK"
          }
          EOF

          bubblewrap doctor

      - name: Prepare test signing key
        run: |
          rm -rf android-twa
          mkdir -p android-twa
          keytool -genkeypair -v             -keystore "$GITHUB_WORKSPACE/android-twa/android.keystore"             -alias android             -keyalg RSA             -keysize 2048             -validity 10000             -storepass changeit             -keypass changeit             -dname "CN=NeoCooler Test, OU=NeoCooler, O=NeoCooler, L=Itajai, ST=SC, C=BR"

      - name: Initialize TWA project
        run: |
          {
            for i in {1..15}; do printf '\n'; done
            printf '%s\n' "$GITHUB_WORKSPACE/android-twa/android.keystore"
            printf '%s\n' "android"
          } | bubblewrap init             --manifest=https://neocooler.netlify.app/manifest.webmanifest             --directory=android-twa

      - name: Build signed APK only
        working-directory: android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: changeit
          BUBBLEWRAP_KEY_PASSWORD: changeit
        run: |
          bubblewrap build             --skipPwaValidation             --signingKeyPath="$GITHUB_WORKSPACE/android-twa/android.keystore"             --signingKeyAlias=android

      - name: Verify APK
        run: |
          test -s android-twa/app-release-signed.apk
          ls -lh android-twa/app-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neocooler-test-apk
          path: android-twa/app-release-signed.apk
          if-no-files-found: error
