name: Build NeoCooler Android APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "vite.config.js"
      - "index.html"
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build web app
        run: npm install --no-audit --no-fund && npm run build

      - name: Install Bubblewrap 1.25
        run: npm install -g @bubblewrap/cli@1.25.0

      - name: Prepare Bubblewrap-compatible Android SDK
        run: |
          set -e
          BW_SDK="$HOME/.bubblewrap/android_sdk"
          rm -rf "$BW_SDK"
          mkdir -p "$BW_SDK"

          cp -a "$ANDROID_SDK_ROOT/cmdline-tools/latest/." "$BW_SDK/"
          ln -sfn "$ANDROID_SDK_ROOT/platform-tools" "$BW_SDK/platform-tools"
          # Install the required Android platform directly into Bubblewrap SDK.

          yes | "$BW_SDK/bin/sdkmanager" --sdk_root="$BW_SDK" --licenses || true
          "$BW_SDK/bin/sdkmanager" --sdk_root="$BW_SDK" "platforms;android-36" "build-tools;34.0.0"

          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME_17_X64",
            "androidSdkPath": "$BW_SDK"
          }
          EOF

          bubblewrap doctor

      - name: Validate pinned PWA manifest and PNG icon
        run: |
          set -e
          MANIFEST_URL="https://raw.githubusercontent.com/andermuchael-glitch/controle-producao/main/public/manifest.webmanifest?v=20261009b"
          EXPECTED_ICON="https://cdn.jsdelivr.net/gh/andermuchael-glitch/controle-producao@main/public/icone-neocooler-512-v2.png"
          curl --fail --silent --show-error --location "$MANIFEST_URL" -o /tmp/neocooler-manifest.webmanifest
          ICON_URL="$(node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("/tmp/neocooler-manifest.webmanifest","utf8"));const i=(m.icons||[]).find(x=>x.sizes==="512x512"&&x.type==="image/png");if(!i)process.exit(2);process.stdout.write(i.src)')"
          test "$ICON_URL" = "$EXPECTED_ICON"
          curl --fail --silent --show-error --location -D /tmp/neocooler-icon.headers "$ICON_URL" -o /tmp/neocooler-icon.png
          grep -Eiq "^content-type: image/png" /tmp/neocooler-icon.headers || { echo "O CDN não informou MIME image/png para o ícone."; cat /tmp/neocooler-icon.headers; exit 1; }
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const p=fs.readFileSync("/tmp/neocooler-icon.png");
          const signature=Buffer.from([137,80,78,71,13,10,26,10]);
          if(p.length<1000 || !p.subarray(0,8).equals(signature)) throw new Error(`O ícone não é um PNG binário válido (tamanho: ${p.length} bytes; assinatura PNG: ${p.subarray(0,8).toString("hex")}).`);
          const w=p.readUInt32BE(16), h=p.readUInt32BE(20);
          if(w!==512 || h!==512) throw new Error(`Dimensão incorreta: ${w}x${h}; esperado 512x512.`);
          console.log(`Ícone PNG validado: ${w}x${h}, ${p.length} bytes.`);
          NODE

      - name: Prepare test signing key
        run: |
          set -e
          rm -rf android-twa
          mkdir -p android-twa
          keytool -genkeypair -v             -keystore "$GITHUB_WORKSPACE/android-twa/android.keystore"             -alias android             -keyalg RSA             -keysize 2048             -validity 10000             -storepass changeit             -keypass changeit             -dname "CN=NeoCooler Test, OU=NeoCooler, O=NeoCooler, L=Itajai, ST=SC, C=BR"

      - name: Generate TWA project from explicit manifest
        working-directory: android-twa
        run: |
          set -e
          cp ../scripts/twa-manifest.template.json twa-manifest.json
          bubblewrap update --skipVersionUpgrade
          test -s twa-manifest.json
          test -s manifest-checksum.txt
          test -f app/build.gradle
          echo "Projeto TWA gerado sem prompts interativos."

      - name: Build signed APK only
        working-directory: android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: changeit
          BUBBLEWRAP_KEY_PASSWORD: changeit
          ANDROID_HOME: /home/runner/.bubblewrap/android_sdk
          ANDROID_SDK_ROOT: /home/runner/.bubblewrap/android_sdk
        run: |
          bubblewrap build             --skipPwaValidation             --signingKeyPath="$GITHUB_WORKSPACE/android-twa/android.keystore"             --signingKeyAlias=android

      - name: Verify APK
        run: |
          set -e
          test -s android-twa/app-release-signed.apk
          file android-twa/app-release-signed.apk
          ls -lh android-twa/app-release-signed.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs android-twa/app-release-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: neocooler-test-apk
          path: android-twa/app-release-signed.apk
          if-no-files-found: error
