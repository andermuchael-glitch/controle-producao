name: Apply Pre-Corte Audit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python scripts/apply_pre_corte_audit.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/storage.js firestore.rules
          git diff --cached --quiet || git commit -m "Fix Pre-Corte filtering and add audit history"
          git push
